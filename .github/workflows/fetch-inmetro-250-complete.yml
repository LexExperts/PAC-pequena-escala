name: Fetch complete Inmetro 250 DOU

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-inmetro-250-complete.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install requests pymupdf pypdf
      - name: Fetch pages 19-20 and validate full annex
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import re, requests, fitz, json
          from pathlib import Path
          from urllib.parse import urlencode
          from pypdf import PdfReader, PdfWriter
          requests.packages.urllib3.disable_warnings()
          base='https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer'
          files=[]; meta=[]
          for p in (19,20):
            u=base+'?'+urlencode({'captchafield':'firstAccess','data':'14/06/2021','jornal':'515','pagina':str(p)})
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=45,verify=False)
            assert r.status_code==200 and r.content[:4]==b'%PDF',(p,r.status_code,len(r.content))
            f=Path('out')/f'dou_2021-06-14_s1_p{p}.pdf'; f.write_bytes(r.content); files.append(f)
            d=fitz.open(stream=r.content,filetype='pdf'); t='\n'.join(x.get_text() for x in d)
            meta.append({'page':p,'url':u,'chars':len(t)})
          w=PdfWriter()
          for f in files:
            for pg in PdfReader(str(f)).pages: w.add_page(pg)
          out=Path('out/PIL08-DOC01.pdf')
          with out.open('wb') as fh: w.write(fh)
          d=fitz.open(out); t='\n'.join(x.get_text() for x in d); n=re.sub(r'\s+',' ',t).upper()
          for marker in ['PORTARIA INMETRO Nº 250','ANEXO - REGULAMENTO TÉCNICO METROLÓGICO','4.17','5.4','DEZ VEZES O PESO DO PRODUTO']:
            assert marker in n, marker
          assert d.page_count==2
          Path('out/PIL14-DOC02.pdf').write_bytes(out.read_bytes())
          Path('out/metadata.json').write_text(json.dumps({'pages':meta,'merged_pages':2},ensure_ascii=False,indent=2),encoding='utf-8')
          print('validated pages=',d.page_count,'chars=',len(t))
          PY
      - name: Upload complete publication
        uses: actions/upload-artifact@v4
        with:
          name: inmetro-250-complete-dou
          path: out/
          if-no-files-found: error
          retention-days: 3
