name: Official corpus repairs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-corpus-repairs.yml'
      - 'payload/official_repairs.py.gz.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 lxml pymupdf pypdf
      - name: Decode and verify script
        shell: bash
        run: |
          base64 -d payload/official_repairs.py.gz.b64 | gzip -d > /tmp/fetch_official_repairs.py
          echo '2f91ac88d78e5b24e0778a73906a513259a13c019ec7f608bc3ddf7a35d3be1f  /tmp/fetch_official_repairs.py' | sha256sum -c -
          python -m py_compile /tmp/fetch_official_repairs.py
      - name: Materialize official HTML and DOU PDFs
        run: python /tmp/fetch_official_repairs.py
      - name: Upload repairs
        uses: actions/upload-artifact@v4
        with:
          name: official-corpus-repairs
          path: official_repairs/
          if-no-files-found: error
          retention-days: 3
