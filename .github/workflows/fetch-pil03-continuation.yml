name: Fetch PIL03 continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-pil03-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install requests pymupdf
      - name: Fetch DOU pages 101-104
        shell: bash
        run: |
          mkdir -p pages
          python - <<'PY'
          import json, re, requests, fitz
          from pathlib import Path
          from urllib.parse import urlencode
          requests.packages.urllib3.disable_warnings()
          base='https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer'
          rows=[]
          for p in range(101,105):
            u=base+'?'+urlencode({'captchafield':'firstAccess','data':'22/12/2008','jornal':'1','pagina':str(p)})
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=45,verify=False)
            assert r.status_code==200 and r.content[:4]==b'%PDF',(p,r.status_code,len(r.content))
            path=Path('pages')/f'dou_2008-12-22_s1_p{p:03d}.pdf'; path.write_bytes(r.content)
            d=fitz.open(stream=r.content,filetype='pdf'); t='\n'.join(x.get_text() for x in d); n=re.sub(r'\s+',' ',t).upper()
            rows.append({'page':p,'chars':len(t),'contains_target':('POLVO' in n and 'INSTRUÇÃO NORMATIVA' in n),'contains_art8':('ART. 8' in n),'contains_art9':('ART. 9' in n),'contains_art10':('ART. 10' in n),'alt_count':n.count('ALTEMIR GREGOLIN'),'text':t})
            print(p,rows[-1]['contains_target'],rows[-1]['contains_art8'],rows[-1]['contains_art9'],rows[-1]['contains_art10'],rows[-1]['alt_count'])
          Path('page_index.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload pages
        uses: actions/upload-artifact@v4
        with:
          name: pil03-continuation-pages
          path: |
            pages/
            page_index.json
          if-no-files-found: error
          retention-days: 3
