name: Fetch PIL14 official PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-pil14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install pymupdf requests
      - name: Download only from the official Inmetro endpoint
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys, time
          from pathlib import Path
          import requests

          path='/sidoq/Arquivos/SEMEP/NIT/NIT-Semep-21_01.pdf'
          urls=[
            'https://www.inmetro.gov.br'+path,
            'http://www.inmetro.gov.br'+path,
            'https://inmetro.gov.br'+path,
            'http://inmetro.gov.br'+path,
            'https://rweb01s.inmetro.gov.br'+path,
            'http://rweb01s.inmetro.gov.br'+path,
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'}
          log=[]
          out=Path('PIL14-DOC01.pdf')
          out.unlink(missing_ok=True)
          used=None

          for url in urls:
            for verify in (True, False):
              try:
                log.append(f'REQUESTS {url} verify={verify}')
                with requests.get(url,headers=headers,timeout=(20,100),allow_redirects=True,verify=verify,stream=True) as r:
                  log.append(f'  status={r.status_code} final={r.url} content-type={r.headers.get("content-type")}')
                  r.raise_for_status()
                  data=b''.join(r.iter_content(1024*1024))
                log.append(f'  bytes={len(data)} magic={data[:8]!r}')
                if data.startswith(b'%PDF'):
                  out.write_bytes(data); used=r.url; break
              except Exception as e:
                log.append(f'  ERROR {type(e).__name__}: {e}')
            if out.exists(): break

          curl_candidates=[
            ['curl','-k','-4','-fL','--http1.0','--connect-timeout','20','--max-time','110','-A','Mozilla/5.0','-o','candidate.bin','https://www.inmetro.gov.br'+path],
            ['curl','-4','-fL','--http1.0','--connect-timeout','20','--max-time','110','-A','Mozilla/5.0','-o','candidate.bin','http://www.inmetro.gov.br'+path],
            ['curl','-k','-4','-fL','--resolve','www.inmetro.gov.br:443:200.20.212.34','--connect-timeout','20','--max-time','110','-A','Mozilla/5.0','-o','candidate.bin','https://www.inmetro.gov.br'+path],
            ['curl','-4','-fL','-H','Host: www.inmetro.gov.br','--connect-timeout','20','--max-time','110','-A','Mozilla/5.0','-o','candidate.bin','http://200.20.212.34'+path],
          ]
          if not out.exists():
            for cmd in curl_candidates:
              Path('candidate.bin').unlink(missing_ok=True)
              log.append('CURL '+' '.join(cmd))
              try:
                cp=subprocess.run(cmd,capture_output=True,text=True,timeout=125)
                log.append(f'  rc={cp.returncode} stdout={cp.stdout[-500:]} stderr={cp.stderr[-1000:]}')
                p=Path('candidate.bin')
                if p.exists():
                  data=p.read_bytes(); log.append(f'  bytes={len(data)} magic={data[:8]!r}')
                  if data.startswith(b'%PDF'):
                    p.replace(out); used=cmd[-1]; break
              except Exception as e:
                log.append(f'  ERROR {type(e).__name__}: {e}')
            Path('candidate.bin').unlink(missing_ok=True)

          Path('attempts.log').write_text('\n'.join(log),encoding='utf-8')
          if not out.exists():
            print('\n'.join(log))
            raise SystemExit('Official PDF not downloaded on this runner')
          Path('URL_OFICIAL.txt').write_text(used+'\n',encoding='utf-8')
          PY
      - name: Validate identity and completeness
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, re, fitz, os
          path='PIL14-DOC01.pdf'
          doc=fitz.open(path)
          text='\n'.join(page.get_text() for page in doc)
          norm=re.sub(r'\s+',' ',text).upper()
          required=['NIT-SEMEP-021','REVISÃO 01','SET/2025','PESCADOS GLACIADOS']
          missing=[x for x in required if x not in norm]
          assert doc.page_count >= 1, 'PDF sem páginas'
          assert not missing, f'Missing markers: {missing}'
          print('pages=',doc.page_count)
          print('sha256=',hashlib.sha256(open(path,'rb').read()).hexdigest())
          print('bytes=',os.path.getsize(path))
          print('markers=OK')
          PY
          sha256sum PIL14-DOC01.pdf > PIL14-DOC01.sha256 || shasum -a 256 PIL14-DOC01.pdf > PIL14-DOC01.sha256
      - name: Upload PIL14 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pil14-doc01-official-${{ matrix.os }}
          path: |
            PIL14-DOC01.pdf
            PIL14-DOC01.sha256
            URL_OFICIAL.txt
            attempts.log
          if-no-files-found: warn
          retention-days: 3
