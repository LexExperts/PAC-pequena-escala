name: Fetch PIL14 official PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-pil14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install pymupdf requests
      - name: Diagnose official endpoints and download
        shell: bash
        run: |
          set -u
          echo 'DNS:'
          getent ahosts www.inmetro.gov.br || true
          getent ahosts inmetro.gov.br || true
          dig +short A www.inmetro.gov.br || true
          dig +short AAAA www.inmetro.gov.br || true
          candidates=(
            'http://www.inmetro.gov.br/sidoq/Arquivos/SEMEP/NIT/NIT-Semep-21_01.pdf'
            'https://www.inmetro.gov.br/sidoq/Arquivos/SEMEP/NIT/NIT-Semep-21_01.pdf'
            'http://inmetro.gov.br/sidoq/Arquivos/SEMEP/NIT/NIT-Semep-21_01.pdf'
            'https://inmetro.gov.br/sidoq/Arquivos/SEMEP/NIT/NIT-Semep-21_01.pdf'
          )
          : > attempts.log
          rm -f PIL14-DOC01.pdf
          for URL in "${candidates[@]}"; do
            echo "TRY $URL" | tee -a attempts.log
            curl -k -fL --retry 1 --retry-all-errors --connect-timeout 15 --max-time 90 -A 'Mozilla/5.0' -o candidate.bin "$URL" 2>&1 | tee -a attempts.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ] && [ "$(head -c 4 candidate.bin 2>/dev/null)" = '%PDF' ]; then
              mv candidate.bin PIL14-DOC01.pdf
              printf '%s\n' "$URL" > URL_OFICIAL.txt
              break
            fi
            rm -f candidate.bin
          done
          test -f PIL14-DOC01.pdf
      - name: Validate identity and completeness
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, re, fitz
          path='PIL14-DOC01.pdf'
          doc=fitz.open(path)
          text='\n'.join(page.get_text() for page in doc)
          norm=re.sub(r'\s+',' ',text).upper()
          assert doc.page_count == 4, f'Expected 4 pages, got {doc.page_count}'
          required=['NIT-SEMEP-021','REVISÃO 01','SET/2025','PESCADOS GLACIADOS']
          missing=[x for x in required if x not in norm]
          assert not missing, f'Missing markers: {missing}'
          approval=any(x in norm for x in ['APROVADO POR','APROVAÇÃO','RESPONSABILIDADE'])
          signature=any(x in norm for x in ['ASSINATURA','APROVADOR','REVISOR','ELABORADOR'])
          assert approval or signature, 'Approval/signature block not detected'
          print('pages=',doc.page_count)
          print('sha256=',hashlib.sha256(open(path,'rb').read()).hexdigest())
          print('bytes=',len(open(path,'rb').read()))
          print('markers=OK')
          PY
          sha256sum PIL14-DOC01.pdf > PIL14-DOC01.sha256
      - name: Upload PIL14 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pil14-doc01-official
          path: |
            PIL14-DOC01.pdf
            PIL14-DOC01.sha256
            URL_OFICIAL.txt
            attempts.log
          if-no-files-found: warn
          retention-days: 3
