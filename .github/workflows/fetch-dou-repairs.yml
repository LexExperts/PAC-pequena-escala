name: Fetch DOU repairs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-dou-repairs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install requests pymupdf pypdf
      - name: Fetch and validate official DOU pages
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urlencode
          import json, re, requests, fitz
          from pypdf import PdfReader, PdfWriter

          requests.packages.urllib3.disable_warnings()
          BASE='https://pesquisa.in.gov.br/imprensa/servlet/INPDFViewer'
          HEAD={'User-Agent':'Mozilla/5.0'}
          out=Path('repair'); out.mkdir()

          def url(date,journal,page):
              return BASE+'?'+urlencode({'captchafield':'firstAccess','data':date,'jornal':str(journal),'pagina':str(page)})

          def fetch(date,journal,page):
              u=url(date,journal,page)
              try:
                  r=requests.get(u,headers=HEAD,timeout=45,verify=False,allow_redirects=True)
                  if r.status_code==200 and r.content[:4]==b'%PDF':
                      d=fitz.open(stream=r.content,filetype='pdf')
                      t='\n'.join(p.get_text() for p in d)
                      return {'page':page,'url':u,'ok':True,'bytes':len(r.content),'text':t,'data':r.content}
                  return {'page':page,'url':u,'ok':False,'status':r.status_code,'bytes':len(r.content)}
              except Exception as e:
                  return {'page':page,'url':u,'ok':False,'error':repr(e)}

          # PIL10-DOC01: certified DOU pages 202-204, 16/12/2021, section 1.
          p10=[]
          for p in (202,203,204):
              rec=fetch('16/12/2021',515,p)
              assert rec.get('ok'), rec
              f=out/f'pil10_p{p}.pdf'; f.write_bytes(rec['data']); p10.append(f)
              rec.pop('data',None)
          w=PdfWriter()
          for f in p10:
              for pg in PdfReader(str(f)).pages: w.add_page(pg)
          with open(out/'PIL10-DOC01.pdf','wb') as fh: w.write(fh)
          d=fitz.open(out/'PIL10-DOC01.pdf'); t='\n'.join(p.get_text() for p in d); n=re.sub(r'\s+',' ',t).upper()
          assert 'RESOLUÇÃO CONAMA Nº 503' in n or 'RESOLUÇÃO CONAMA N O- 503' in n or ('CONAMA' in n and '503' in n and 'FERTIRRIGAÇÃO' in n)
          assert 'JOAQUIM ÁLVARO PEREIRA LEITE' in n or 'JOAQUIM ALVARO PEREIRA LEITE' in n
          assert d.page_count==3

          # PIL03-DOC02: scan the official issue published on 22/12/2008.
          def scan_page(p):
              rec=fetch('22/12/2008',1,p)
              if not rec.get('ok'): return rec
              n=re.sub(r'\s+',' ',rec['text']).upper()
              rec['hit']=('INSTRUÇÃO NORMATIVA' in n and re.search(r'N\s*[ºO°.-]*\s*26\b',n) is not None and ('POLVO' in n or 'OCTOPUS' in n))
              rec.pop('data',None)
              return rec

          scan=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs={ex.submit(scan_page,p):p for p in range(1,181)}
              for fut in as_completed(futs): scan.append(fut.result())
          scan.sort(key=lambda x:x['page'])
          hits=[r['page'] for r in scan if r.get('hit')]
          assert hits, 'PIL03-DOC02 not found in official DOU issue 22/12/2008 pages 1-180'
          first=hits[0]
          chosen=[]; seen_start=False; seen_signature=False
          for p in range(max(1,first), first+5):
              rec=fetch('22/12/2008',1,p)
              assert rec.get('ok'), rec
              n=re.sub(r'\s+',' ',rec['text']).upper()
              if p==first:
                  assert 'POLVO' in n or 'OCTOPUS' in n
                  seen_start=True
              f=out/f'pil03_p{p}.pdf'; f.write_bytes(rec['data']); chosen.append(f)
              if 'ALTEMIR GREGOLIN' in n:
                  seen_signature=True
                  break
          assert seen_start and seen_signature, {'first':first,'chosen':[x.name for x in chosen]}
          w=PdfWriter()
          for f in chosen:
              for pg in PdfReader(str(f)).pages: w.add_page(pg)
          with open(out/'PIL03-DOC02.pdf','wb') as fh: w.write(fh)
          d=fitz.open(out/'PIL03-DOC02.pdf'); t='\n'.join(p.get_text() for p in d); n=re.sub(r'\s+',' ',t).upper()
          assert 'POLVO' in n and 'ALTEMIR GREGOLIN' in n

          metadata={
            'PIL10-DOC01':{'pages':[202,203,204],'date':'16/12/2021','journal':515,'pdf_pages':fitz.open(out/'PIL10-DOC01.pdf').page_count},
            'PIL03-DOC02':{'publication_date':'22/12/2008','journal':1,'hit_pages':hits,'selected_pages':[int(re.search(r'(\d+)\.pdf$',x.name).group(1)) for x in chosen], 'scan':[ {k:v for k,v in r.items() if k not in ('text','data')} for r in scan]},
          }
          (out/'metadata.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='scan'} for k,v in metadata.items()},ensure_ascii=False,indent=2))
          PY
      - name: Upload repaired official files
        uses: actions/upload-artifact@v4
        with:
          name: dou-repairs-pilot
          path: repair/
          if-no-files-found: error
          retention-days: 3
