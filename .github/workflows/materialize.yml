name: Materialize corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pypdf pymupdf python-docx openpyxl playwright
          python -m playwright install --with-deps chromium
      - name: Restore and verify materialization script
        shell: bash
        run: |
          cat payload/part* > /tmp/materialize.b64
          echo '7fe6a47ee7bf0473322595067077e0688bd5b5e5d432805b726e0d048ec754e9  /tmp/materialize.b64' | sha256sum -c -
          base64 -d /tmp/materialize.b64 | gzip -d > /tmp/materialize_corpus.py
          echo '91f9c73e893a5932cad46533bcb3c148db5a7a1d8c1f77f4a0d658eee7737fea  /tmp/materialize_corpus.py' | sha256sum -c -
          sed -i 's/timeout=120/timeout=25/g; s/timeout_ms: int = 120000/timeout_ms: int = 45000/g; s/timeout=30000/timeout=10000/g' /tmp/materialize_corpus.py
          python -m py_compile /tmp/materialize_corpus.py
      - name: Materialize, validate and package
        run: python /tmp/materialize_corpus.py --output-dir build
      - name: Upload corpus artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-documental-materializado-piloto-v1-1
          path: build/CORPUS_DOCUMENTAL_MATERIALIZADO_PILOTO_v1.1.zip
          if-no-files-found: error
          retention-days: 3

