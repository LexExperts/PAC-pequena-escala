name: Materialize corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pypdf pymupdf python-docx openpyxl playwright
          python -m playwright install --with-deps chromium
      - name: Restore materialization script
        shell: bash
        run: |
          cat > /tmp/materialize.b64 <<'B64'

B64
          base64 -d /tmp/materialize.b64 | gzip -d > /tmp/materialize_corpus.py
          python -m py_compile /tmp/materialize_corpus.py
      - name: Materialize, validate and package
        run: python /tmp/materialize_corpus.py --output-dir build
      - name: Upload corpus artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-documental-materializado-piloto-v1-1
          path: build/CORPUS_DOCUMENTAL_MATERIALIZADO_PILOTO_v1.1.zip
          if-no-files-found: error
          retention-days: 3
